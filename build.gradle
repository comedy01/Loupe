plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

def minecraftVersion = project.minecraft_version
def remap = minecraftVersion.startsWith("1.")

def versionProps = new Properties()
file("versions/${minecraftVersion}.properties").withInputStream { versionProps.load(it) }

def packs = versionProps.getProperty("packs").split(",")
def label = versionProps.getProperty("label")
def minecraftRange = versionProps.getProperty("range")
def keyModule = versionProps.getProperty("key_module")
def javaVersion = versionProps.getProperty("java").toInteger()
def fabricApiVersion = versionProps.getProperty("fabric_api_version")
def modmenuVersion = versionProps.getProperty("modmenu_version")
def gametest = versionProps.getProperty("gametest", "true") == "true"

apply plugin: remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

version = "${project.mod_version}+mc${label}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

packs.each { pack ->
	sourceSets.main.java.srcDir "src/compat/${pack}/java"
}
sourceSets.configureEach {
	if (gametest && it.name == "gametest") {
		packs.each { pack ->
			it.java.srcDir "src/compat/${pack}/gametest/java"
		}
	}
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"

	if (remap) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
		modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
		compileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
	}

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraftRange", minecraftRange
	inputs.property "keyModule", keyModule

	filesMatching(["fabric.mod.json", "loupe.mixins.json"]) {
		expand "version": version, "minecraft_range": minecraftRange, "key_module": keyModule, "java_version": javaVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)

	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

if (gametest) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "loupe-test"
			enableGameTests = false
			enableClientGameTests = true
		}
	}
}
